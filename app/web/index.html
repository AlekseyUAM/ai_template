<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <title>Agent Monitor</title>
  <link rel="stylesheet" href="/static/github-dark.css" />
  <style>
    :root {
      --bg:#0d1117; --panel:#161b22; --panel2:#21262d; --border:#30363d;
      --txt:#c9d1d9; --muted:#8b949e; --accent:#58a6ff; --accent2:#1f2937;
      --green:#3fb950; --yellow:#d29922; --red:#f85149;
    }
    * { box-sizing:border-box; }
    html, body {
      height:100%; margin:0; padding:0; max-width:none;
      font-family: system-ui, sans-serif; background:var(--bg); color:var(--txt);
    }
    body { display:flex; flex-direction:column; height:100vh; overflow:hidden; }

    #content {
      display:flex; flex:1; gap:16px; padding:16px;
      overflow:hidden; min-height:0;
    }

    .panel {
      flex:1; background:var(--panel); border:1px solid var(--border);
      border-radius:8px; display:flex; flex-direction:column; overflow:hidden;
    }
    .panel-title {
      padding:10px 14px; font-size:12px; font-weight:600; text-transform:uppercase;
      letter-spacing:.05em; color:var(--muted); border-bottom:1px solid var(--border);
      background:#0d1117;
    }
    .panel-body { flex:1; overflow-y:auto; padding:12px 14px; }
    /* Панель «Выполнение»: не скроллим саму панель — высоту держат стеки,
       внутри каждого стека прокручивается только список задач. */
    .panel-body.exec-body { overflow:hidden; display:flex; flex-direction:column; }

    /* Кнопки создания */
    .action-row { display:flex; gap:8px; margin-bottom:14px; }
    .btn {
      padding:7px 14px; border-radius:6px; font:inherit; font-size:13px;
      cursor:pointer; border:1px solid var(--border); background:var(--panel2);
      color:var(--txt); text-decoration:none; display:inline-flex; align-items:center;
      gap:6px; transition:background 0.15s;
    }
    .btn:hover { background:#2d333b; }
    .btn.primary { background:#238636; border-color:#2ea043; color:#fff; }
    .btn.primary:hover { background:#2ea043; }

    /* Дерево */
    .tree-project {
      margin-bottom:12px; border:1px solid var(--border); border-radius:6px;
      overflow:hidden;
    }
    .tree-project-header {
      display:flex; align-items:flex-end; gap:8px; padding:8px 10px;
      background:var(--panel2); font-size:13px; font-weight:600; cursor:pointer;
    }
    .tree-project-header .chevron { font-size:10px; color:var(--muted); width:10px; }
    .tree-project-header .proj-name { flex:1; }
    .tree-project-header .proj-path { font-size:11px; color:var(--muted); font-weight:400; }
    .proj-actions { display:flex; gap:4px; flex-shrink:0; }
    .proj-btn {
      display:inline-flex; align-items:center; justify-content:center;
      width:26px; height:24px; padding:0; border:1px solid var(--border);
      background:var(--panel); color:var(--muted); border-radius:4px; cursor:pointer;
      transition:background 0.15s, color 0.15s, border-color 0.15s;
    }
    .proj-btn:hover { background:#21262d; color:var(--txt); border-color:#444c56; }
    .proj-btn svg { width:15px; height:15px; display:block; }
    .proj-btn.spin svg { animation:proj-spin 0.6s linear infinite; }
    @keyframes proj-spin { to { transform:rotate(360deg); } }
    .tree-tasks { padding:0; }
    .tree-task {
      display:flex; align-items:center; gap:8px; padding:6px 12px;
      border-top:1px solid var(--border); font-size:12px;
    }
    .tree-task:hover { background:#161b22; }
    .task-del {
      color:var(--muted); cursor:pointer; font-size:12px; width:18px; text-align:center;
      border:none; background:none; padding:0; line-height:1; flex-shrink:0;
    }
    .task-del:hover { color:var(--red); }
    .task-name { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .task-path { font-size:11px; color:var(--muted); min-width:0; overflow:hidden;
                 text-overflow:ellipsis; white-space:nowrap;
                 flex:0 1 360px; max-width:420px; }
    .task-status { font-size:11px; min-width:90px; text-align:right; margin-left:auto; }
    .status-running { color:var(--green); }
    .status-failed  { color:var(--red); }
    .status-done    { color:var(--muted); }
    .no-tasks { padding:8px 12px; font-size:12px; color:var(--muted); }

    /* Дерево пустое */
    .tree-empty { color:var(--muted); font-size:13px; padding:8px 0; }

    /* Заглушка */
    .placeholder {
      color:var(--muted); font-size:13px; padding:12px 0; line-height:1.6;
    }

    /* Стеки */
    .stacks-container { display:flex; gap:12px; flex:1; min-height:0; overflow-x:auto; }
    .stack-column {
      flex:0 0 400px; background:var(--panel2); border:1px solid var(--border);
      border-radius:6px; display:flex; flex-direction:column; overflow:hidden;
    }
    .stack-header {
      padding:10px 12px; border-bottom:1px solid var(--border); background:#0d1117;
      display:flex; align-items:flex-end; gap:8px;
    }
    .stack-head-left { flex:1; display:flex; flex-direction:column; min-width:0; }
    .stack-id { font-size:16px; font-weight:700; line-height:1.2; color:var(--txt); }
    .stack-proj { font-size:13px; color:var(--muted); font-weight:400;
                  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .stack-status { font-size:12px; font-weight:600; }
    .stack-status.st-run   { color:var(--green); }
    .stack-status.st-pause { color:var(--yellow); }
    .stack-status.st-idle  { color:var(--accent); }
    .stack-controls { display:flex; align-items:center; gap:6px; }
    .stack-btn {
      display:inline-flex; align-items:center; justify-content:center;
      width:28px; height:28px; padding:0; border:1px solid var(--border);
      background:var(--panel); border-radius:6px; cursor:pointer;
      font-size:15px; line-height:1; color:var(--txt);
      transition:background 0.15s, color 0.15s, border-color 0.15s;
    }
    .stack-btn.start-btn { color:var(--green); border-color:#2ea043; }
    .stack-btn.start-btn:hover { background:rgba(63,185,80,0.18); border-color:var(--green); }
    .stack-btn.stop-btn { color:var(--yellow); border-color:#9e6a03; }
    .stack-btn.stop-btn:hover { background:rgba(210,153,34,0.18); border-color:var(--yellow); }
    /* «Нажата» — залита цветом; неактивна — приглушена и не кликается */
    .stack-btn.start-btn.pressed { background:var(--green); color:#0d1117; border-color:var(--green); }
    .stack-btn.stop-btn.pressed  { background:var(--yellow); color:#0d1117; border-color:var(--yellow); }
    .stack-btn.disabled { opacity:0.35; pointer-events:none; }
    .stack-btn.delete-btn { color:var(--red); border-color:#a40e26; }
    .stack-btn.delete-btn:hover { background:rgba(248,81,73,0.18); border-color:var(--red); }
    .stack-items {
      flex:1; overflow-y:auto; padding:8px; display:flex; flex-direction:column; gap:6px;
    }
    .stack-item {
      padding:8px; background:var(--panel); border:1px solid var(--border);
      border-radius:4px; font-size:12px; cursor:move;
      user-select:none;
      transition:background 0.15s, border-color 0.15s;
    }
    .stack-item[draggable="false"] { cursor:default; }
    .stack-item:hover { background:#161b22; border-color:#444c56; }
    .stack-item.drag-over { background:#238636; opacity:0.7; }
    .stack-item-empty { color:var(--muted); font-size:11px; padding:12px 8px; text-align:center; }
    .task-row { display:flex; align-items:center; gap:4px; cursor:pointer; }
    .chevron { font-size:10px; color:var(--muted); width:10px; }
    .task-details { margin-top:6px; font-size:11px; color:var(--muted); overflow-x:auto; }
    .task-meta { display:flex; flex-direction:column; gap:2px; }
    .task-meta > div { display:flex; justify-content:space-between; gap:8px; }
    .task-meta > div > span { color:var(--muted); }
    .task-meta > div > b { color:var(--txt); font-weight:600; }
    .stage-table { width:100%; border-collapse:collapse; margin-top:4px; font-size:10px; table-layout:fixed; }
    .stage-table th, .stage-table td { text-align:left; padding:1px 3px; border-bottom:1px solid #30363d;
                                       overflow-wrap:anywhere; }
    /* узкие колонки итерации/времени, остальное — под этап и статус */
    .stage-table th:nth-child(3), .stage-table td:nth-child(3) { width:26px; text-align:center; }
    .stage-table th:nth-child(4), .stage-table td:nth-child(4),
    .stage-table th:nth-child(5), .stage-table td:nth-child(5) { width:40px; }
    .stage-table th:nth-child(6), .stage-table td:nth-child(6) { width:46px; }
    .report-btn { font-size:10px; padding:1px 6px; cursor:pointer; background:#21262d; color:#c9d1d9; border:1px solid #30363d; border-radius:4px; }
    .report-btn:hover { background:#30363d; }
    .stack-item-del { margin-left:auto; font-size:11px; line-height:1; padding:0 4px; cursor:pointer; background:none; color:var(--muted); border:none; }
    .stack-item-del:hover { color:#f85149; }

    /* Draggable tree tasks */
    .tree-task { cursor:grab; }
    .tree-task:active { cursor:grabbing; }
    .tree-task.drag-from { opacity:0.5; }

    /* Stack empty drop area */
    .stack-drop-hint {
      padding:12px 8px; background:rgba(88,166,255,0.1); border:2px dashed var(--accent);
      border-radius:4px; text-align:center; font-size:11px; color:var(--accent);
      display:none;
    }
    .stack-drop-hint.active { display:block; }
    .stack-drop-hint.over { background:rgba(88,166,255,0.2); }
  </style>
</head>
<body>
  <div id="content">
    <!-- Панель «Проекты и задачи» -->
    <div class="panel">
      <div class="panel-title">Проекты и задачи</div>
      <div class="panel-body">
        <div class="action-row">
          <a href="/project-wizard" class="btn primary">+ Создать проект</a>
          <a href="/task-wizard" class="btn">+ Создать задачу</a>
        </div>
        <div id="tree"><span class="tree-empty">Загрузка…</span></div>
      </div>
    </div>

    <!-- Панель «Выполнение» -->
    <div class="panel">
      <div class="panel-title">Выполнение</div>
      <div class="panel-body exec-body">
        <div class="action-row">
          <button class="btn primary" id="btn-create-stack">+ Создать стек</button>
        </div>
        <div id="stacks-container" class="stacks-container">
          <div class="placeholder">Загрузка стеков…</div>
        </div>
      </div>
    </div>
  </div>

  <script src="/static/esc.js"></script>
  <script src="/static/start.js?v=6"></script>
  <script src="/static/header.js"></script>
</body>
</html>
