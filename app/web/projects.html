<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Проекты</title>
  <link rel="stylesheet" href="/static/github-dark.css">
  <style>
    body { max-width: 900px; }
    .projects-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }
    .projects-header h1 {
      margin-bottom: 0;
      border-bottom: none;
      padding-bottom: 0;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
      margin-bottom: 24px;
    }
    th {
      background-color: var(--bg-subtle);
      color: var(--fg);
      font-weight: 600;
      padding: 12px 16px;
      text-align: left;
      border-bottom: 1px solid var(--border);
      font-size: 0.875rem;
    }
    td {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
    }
    tbody tr {
      cursor: pointer;
      transition: background-color 0.15s ease;
    }
    tbody tr:hover {
      background-color: var(--bg-subtle);
    }
    tbody tr:last-child td {
      border-bottom: none;
    }
    .path-cell {
      font-family: monospace;
      font-size: 0.8125rem;
      word-break: break-all;
      color: var(--fg-muted);
    }
    .empty-state {
      background-color: var(--bg-subtle);
      border: 1px dashed var(--border);
      border-radius: 6px;
      padding: 32px;
      text-align: center;
      color: var(--fg-muted);
    }
    .empty-state h2 {
      margin-top: 0;
      color: var(--fg);
    }
    .project-card-panel {
      background-color: var(--bg-subtle);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 24px;
      margin-bottom: 24px;
    }
    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }
    .card-header h2 {
      margin: 0;
      color: var(--fg);
      font-size: 1.25rem;
    }
    .back-link {
      cursor: pointer;
      color: var(--accent);
      text-decoration: none;
      font-weight: 500;
    }
    .back-link:hover {
      text-decoration: underline;
    }
    .card-field {
      margin-bottom: 16px;
    }
    .card-label {
      color: var(--fg-muted);
      font-size: 0.875rem;
      margin-bottom: 4px;
      display: block;
    }
    .card-value {
      color: var(--fg);
      word-break: break-all;
    }
    .card-value.monospace {
      font-family: monospace;
      font-size: 0.8125rem;
    }
    .card-controls {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 16px;
    }
  </style>
</head>
<body>
  <div class="projects-header">
    <h1>Проекты</h1>
    <a href="/project-wizard" style="display: inline-flex; align-items: center; justify-content: center; gap: 4px; cursor: pointer; background-color: var(--btn-bg); color: var(--fg); border: 1px solid var(--btn-border); border-radius: 6px; padding: 5px 16px; font-size: 0.875rem; font-family: inherit; font-weight: 500; line-height: 1.5; text-decoration: none; transition: background-color 0.15s ease, border-color 0.15s ease; margin-right: 8px; margin-top: 4px; margin-bottom: 0;">+ Создать проект</a>
  </div>

  <div id="tableView">
    <table>
      <thead>
        <tr>
          <th>Имя</th>
          <th>Путь</th>
        </tr>
      </thead>
      <tbody id="projectsTable">
      </tbody>
    </table>
  </div>

  <div id="cardPanel" style="display: none;"></div>

  <script src="/static/esc.js"></script>
  <script src="/static/projects.js"></script>
  <script src="/static/header.js"></script>
</body>
</html>
