[pytest]
pythonpath = src
testpaths = tests
asyncio_mode = auto
markers =
    e2e: end-to-end tests against a running AgentMon (opt-in: AGENTMON_E2E=1)
# Silence third-party test-client deprecations (not our code); keep our own visible.
filterwarnings =
    ignore:Using `httpx` with `starlette.testclient` is deprecated.*
    ignore:The anyio.abc.BlockingPortal alias is deprecated.*:DeprecationWarning
